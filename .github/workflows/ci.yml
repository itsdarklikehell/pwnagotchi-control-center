name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: |
          if [ -f ruff.toml ]; then
            ruff check .
          else
            echo "::notice::No ruff.toml found; skipping ruff."
          fi

  shell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell script syntax check
        run: |
          find . -name "*.sh" -exec bash -n {} \; 2>&1

      - name: Check shell scripts have set -e
        run: |
          for f in $(find . -name "*.sh"); do
            if ! grep -q "set -e" "$f"; then
              echo "::warning::$f missing 'set -e'"
            fi
          done

      - name: Check for common shell issues
        run: |
          # Check for curl without --fail
          for f in $(find . -name "*.sh"); do
            if grep -q "curl " "$f" && ! grep -q -- "--fail" "$f"; then
              echo "::warning::$f has curl without --fail"
            fi
          done

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        continue-on-error: true
        with:
          scandir: './Scripts'
          format: gcc

  python-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run tests
        run: |
          if [ -d "tests" ]; then
            python -m pytest tests/ -v
          fi
